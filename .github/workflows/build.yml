name: Build Procursus

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Target package or rule (e.g. bash-package, nano-package, bootstrap)"
        required: true
        default: "bash-package"
      target:
        description: "Architecture / Environment target"
        required: true
        default: "iphoneos-arm64-rootless"
        type: choice
        options:
          - "iphoneos-arm64-rootless"
          - "iphoneos-arm64"
          - "iphoneos-arm64e-rootless"
          - "darwin-arm64"
      cfver:
        description: "CoreFoundation version (e.g. 1900 for iOS 16, 2000 for iOS 17, 1800 for iOS 15)"
        required: true
        default: "1900"
      package_ipa:
        description: "Package output into a Jailed .ipa file"
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build ${{ inputs.package }} (${{ inputs.target }})
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Homebrew dependencies
        run: |
          brew install make automake autoconf cmake pkg-config ldid dpkg zstd gnu-tar zip
          echo "/opt/homebrew/bin:/usr/local/bin" >> $GITHUB_PATH

      - name: Setup Procursus toolchain
        run: |
          ARCH=$(uname -m | sed 's/x86_64/amd64/')
          echo "Detected runner architecture: ${ARCH}"
          curl -L "https://apt.procurs.us/bootstraps/big_sur/bootstrap-darwin-${ARCH}.tar.zst" | zstdcat - | sudo tar -xpkf - -C / || true
          echo "/opt/procursus/bin:/opt/procursus/sbin" >> $GITHUB_PATH
          echo "CPATH=/opt/procursus/include" >> $GITHUB_ENV
          echo "LIBRARY_PATH=/opt/procursus/lib" >> $GITHUB_ENV

      - name: Compile target
        run: |
          MAKE_CMD=$(command -v gmake || echo make)
          $MAKE_CMD ${{ inputs.package }} \
            MEMO_TARGET=${{ inputs.target }} \
            MEMO_CFVER=${{ inputs.cfver }} \
            BUILD_ROOT="${{ github.workspace }}" \
            NO_PGP=1

      - name: Build Jailed IPA
        if: ${{ inputs.package_ipa }}
        run: |
          ./build_tools/make_jailed_ipa.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: procursus-${{ inputs.package }}-${{ inputs.target }}
          path: |
            build_dist/*.deb
            build_strap/*.tar*
            *.ipa
          if-no-files-found: warn
