name: Build Procursus

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Target package or rule (e.g. bash-package, nano-package, bootstrap)"
        required: true
        default: "bash-package"
      target:
        description: "Architecture / Environment target"
        required: true
        default: "iphoneos-arm64-rootless"
        type: choice
        options:
          - "iphoneos-arm64-rootless"
          - "iphoneos-arm64"
          - "iphoneos-arm64e-rootless"
          - "darwin-arm64"
      cfver:
        description: "CoreFoundation version (e.g. 1900 for iOS 16, 2000 for iOS 17, 1800 for iOS 15)"
        required: true
        default: "1900"
      package_ipa:
        description: "Package output into a Jailed .ipa file"
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build ${{ inputs.package }} (${{ inputs.target }})
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Homebrew dependencies
        run: |
          brew install bash make coreutils gnu-sed gnu-tar grep findutils automake autoconf cmake pkg-config ldid dpkg zstd zip groff gpatch gnupg docbook-xsl bison flex gettext ncurses
          echo "/opt/homebrew/opt/gnu-sed/libexec/gnubin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/gnu-tar/libexec/gnubin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/grep/libexec/gnubin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/coreutils/libexec/gnubin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/findutils/libexec/gnubin" >> $GITHUB_PATH
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix flex)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix gettext)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix ncurses)/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/bin:/usr/local/bin" >> $GITHUB_PATH

      - name: Setup Procursus toolchain
        run: |
          ARCH=$(uname -m | sed 's/x86_64/amd64/')
          echo "Detected runner architecture: ${ARCH}"
          curl -L "https://apt.procurs.us/bootstraps/big_sur/bootstrap-darwin-${ARCH}.tar.zst" | zstdcat - | sudo tar -xpkf - -C / || true
          
          # Setup apt user if missing
          if ! id _apt &>/dev/null; then
            sudo dscl . -create /Users/_apt UserShell /usr/bin/false
            sudo dscl . -create /Users/_apt NSFHomeDirectory /var/empty
            sudo dscl . -create /Users/_apt PrimaryGroupID -1
            sudo dscl . -create /Users/_apt UniqueID 499
            sudo dscl . -create /Users/_apt RealName "APT Sandbox User"
          fi
          
          # Setup apt repo keyring and install essential procursus binaries
          sudo mkdir -p /opt/procursus/etc/apt/trusted.gpg.d
          if [ -f "build_misc/keyrings/procursus/memo.gpg" ]; then
            sudo cp build_misc/keyrings/procursus/memo.gpg /opt/procursus/etc/apt/trusted.gpg.d/procursus.gpg
          fi
          
          sudo mkdir -p /opt/procursus/etc/apt/sources.list.d
          echo -e "Types: deb\nURIs: https://apt.procurs.us\nSuites: big_sur\nComponents: main\n" | sudo tee /opt/procursus/etc/apt/sources.list.d/procursus.sources
          sudo /opt/procursus/bin/apt-get update --allow-insecure-repositories || true
          sudo /opt/procursus/bin/apt-get install -y --allow-unauthenticated -o Dpkg::Options::="--force-confnew" odcctools ldid ld64 file fakeroot po4a || true
          
          # Install triehash helper
          sudo curl -sLo /opt/procursus/bin/triehash https://raw.githubusercontent.com/julian-klode/triehash/master/triehash.pl
          sudo chmod +x /opt/procursus/bin/triehash
          
          # Ensure gnubin symlinks exist in /opt/procursus/libexec/gnubin
          sudo mkdir -p /opt/procursus/libexec/gnubin
          sudo ln -sf /opt/homebrew/opt/gnu-sed/libexec/gnubin/sed /opt/procursus/libexec/gnubin/sed
          sudo ln -sf /opt/homebrew/opt/gnu-tar/libexec/gnubin/tar /opt/procursus/libexec/gnubin/tar
          sudo ln -sf /opt/homebrew/opt/grep/libexec/gnubin/grep /opt/procursus/libexec/gnubin/grep
          sudo ln -sf /opt/homebrew/opt/findutils/libexec/gnubin/* /opt/procursus/libexec/gnubin/ || true
          sudo ln -sf /opt/homebrew/opt/coreutils/libexec/gnubin/* /opt/procursus/libexec/gnubin/ || true
          sudo ln -sf "$(brew --prefix bison)/bin/yacc" /opt/procursus/libexec/gnubin/yacc || true
          sudo ln -sf "$(brew --prefix flex)/bin/flex" /opt/procursus/libexec/gnubin/lex || true
          sudo ln -sf "$(brew --prefix gettext)/bin/autopoint" /opt/procursus/libexec/gnubin/autopoint || true
          if command -v gpatch &>/dev/null; then
            sudo ln -sf "$(command -v gpatch)" /opt/procursus/libexec/gnubin/patch
          fi
          
          # Link docbook-xsl
          sudo mkdir -p /opt/procursus/share/xml/docbook/stylesheet
          if [ -d "/opt/homebrew/opt/docbook-xsl/docbook-xsl" ]; then
            sudo ln -sf /opt/homebrew/opt/docbook-xsl/docbook-xsl /opt/procursus/share/xml/docbook/stylesheet/docbook-xsl
          fi
          
          echo "/opt/procursus/bin:/opt/procursus/libexec/gnubin:/opt/procursus/sbin" >> $GITHUB_PATH
          echo "CPATH=/opt/procursus/include" >> $GITHUB_ENV
          echo "LIBRARY_PATH=/opt/procursus/lib" >> $GITHUB_ENV

      - name: Compile target
        run: |
          umask 022
          MAKE_CMD=$(command -v gmake || echo make)
          $MAKE_CMD ${{ inputs.package }} \
            MEMO_TARGET=${{ inputs.target }} \
            MEMO_CFVER=${{ inputs.cfver }} \
            BUILD_ROOT="${{ github.workspace }}" \
            NO_PGP=1

      - name: Build Jailed IPA
        if: ${{ inputs.package_ipa }}
        run: |
          ./build_tools/make_jailed_ipa.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: procursus-${{ inputs.package }}-${{ inputs.target }}
          path: |
            build_dist/*.deb
            build_strap/*.tar*
            *.ipa
          if-no-files-found: warn
